[project]
name = "xasset"
version = "0.1.0"
description = "AI-driven 3D scene asset generation pipeline"
authors = [
    { name = "lizuojun", email = "lizuojun01@corp.netease.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=1.26.0,<2",
    "pydantic>=2.12.5",
]

[project.scripts]
xasset = "xasset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xasset"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
norecursedirs = ["debug", "products"]


